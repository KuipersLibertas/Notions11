<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Large padlock graphic -->
  <!-- Lock body -->
  <rect x="780" y="270" width="220" height="180" rx="20" fill="#a855f715" stroke="#a855f740" stroke-width="2"/>
  <!-- Lock shackle -->
  <path d="M 820 270 L 820 210 Q 820 155 890 155 Q 960 155 960 210 L 960 270" fill="none" stroke="#a855f760" stroke-width="10" stroke-linecap="round"/>
  <!-- Keyhole outer -->
  <circle cx="890" cy="350" r="28" fill="#a855f730" stroke="#a855f760" stroke-width="2"/>
  <!-- Keyhole inner -->
  <circle cx="890" cy="346" r="12" fill="#a855f7"/>
  <!-- Keyhole slot -->
  <rect x="883" y="356" width="14" height="28" rx="4" fill="#a855f7"/>

  <!-- Glow rings -->
  <circle cx="890" cy="350" r="70" fill="none" stroke="#a855f710" stroke-width="1"/>
  <circle cx="890" cy="350" r="110" fill="none" stroke="#a855f708" stroke-width="1"/>

  <!-- Password dots (masked input) -->
  <rect x="720" y="475" width="330" height="40" rx="20" fill="#ffffff08" stroke="#a855f730" stroke-width="1"/>
  <circle cx="768" cy="495" r="6" fill="#a855f7"/>
  <circle cx="798" cy="495" r="6" fill="#a855f7"/>
  <circle cx="828" cy="495" r="6" fill="#a855f7"/>
  <circle cx="858" cy="495" r="6" fill="#a855f7"/>
  <circle cx="888" cy="495" r="6" fill="#a855f740"/>
  <circle cx="918" cy="495" r="6" fill="#a855f720"/>

  <!-- Left content -->
  <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#a855f7" font-weight="700" letter-spacing="2">NOTIONS11</text>
  <rect x="80" y="120" width="60" height="3" rx="2" fill="url(#accent)"/>

  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="#ffffff" font-weight="700">How to</text>
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="#ffffff" font-weight="700">Password</text>
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="#ffffff" font-weight="700">Protect a</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="url(#accent)" font-weight="700">Notion Page</text>

  <text x="80" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">Gate your Notion link in under a minute</text>

  <rect x="80" y="548" width="130" height="32" rx="16" fill="#a855f720" stroke="#a855f740" stroke-width="1"/>
  <text x="145" y="569" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#d8b4fe" text-anchor="middle">notions11.com</text>
</svg>
