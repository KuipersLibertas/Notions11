<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#111a1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Eye / analytics graphic -->
  <!-- Outer eye shape -->
  <path d="M 720 315 Q 820 215 920 315 Q 820 415 720 315 Z" fill="none" stroke="#06b6d440" stroke-width="3"/>
  <!-- Iris -->
  <circle cx="820" cy="315" r="52" fill="#06b6d415" stroke="#06b6d450" stroke-width="2"/>
  <!-- Pupil -->
  <circle cx="820" cy="315" r="28" fill="#06b6d430" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="820" cy="315" r="10" fill="#06b6d4"/>
  <!-- Shine -->
  <circle cx="832" cy="303" r="6" fill="#ffffff50"/>

  <!-- Signal rings -->
  <circle cx="820" cy="315" r="90" fill="none" stroke="#06b6d415" stroke-width="1"/>
  <circle cx="820" cy="315" r="130" fill="none" stroke="#06b6d410" stroke-width="1"/>
  <circle cx="820" cy="315" r="170" fill="none" stroke="#06b6d408" stroke-width="1"/>

  <!-- Analytics mini-bars -->
  <rect x="740" y="430" width="20" height="40" rx="3" fill="#06b6d420"/>
  <rect x="768" y="420" width="20" height="50" rx="3" fill="#06b6d430"/>
  <rect x="796" y="410" width="20" height="60" rx="3" fill="#06b6d440"/>
  <rect x="824" y="400" width="20" height="70" rx="3" fill="#06b6d4"/>
  <rect x="852" y="415" width="20" height="55" rx="3" fill="#06b6d430"/>

  <!-- Location pin -->
  <circle cx="940" cy="230" r="18" fill="#06b6d420" stroke="#06b6d450" stroke-width="2"/>
  <circle cx="940" cy="226" r="7" fill="#06b6d4"/>
  <path d="M 940 240 L 940 256" stroke="#06b6d450" stroke-width="3" stroke-linecap="round"/>

  <!-- Notification dot -->
  <circle cx="720" cy="200" r="8" fill="#f87171"/>
  <text x="720" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">!</text>

  <!-- Left content -->
  <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#06b6d4" font-weight="700" letter-spacing="2">NOTIONS11</text>
  <rect x="80" y="120" width="60" height="3" rx="2" fill="url(#accent)"/>

  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="#ffffff" font-weight="700">How to Track</text>
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="#ffffff" font-weight="700">Who Opened</text>
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="url(#accent)" font-weight="700">Your Notion Link</text>

  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">IP, location, and timestamps</text>
  <text x="80" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">for every access</text>

  <rect x="80" y="530" width="130" height="32" rx="16" fill="#06b6d420" stroke="#06b6d440" stroke-width="1"/>
  <text x="145" y="551" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#67e8f9" text-anchor="middle">notions11.com</text>
</svg>
